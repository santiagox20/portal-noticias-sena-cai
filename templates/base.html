<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal de Noticias | SENA CAI Regional Valle{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --sena-verde: #39A900;
            --sena-verde-oscuro: #2b8000;
            --sena-azul: #00324D;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar-sena {
            background-color: var(--sena-azul);
            border-bottom: 4px solid var(--sena-verde);
        }
        .btn-sena {
            background-color: var(--sena-verde);
            border-color: var(--sena-verde);
            color: #fff;
            font-weight: 600;
        }
        .btn-sena:hover {
            background-color: var(--sena-verde-oscuro);
            border-color: var(--sena-verde-oscuro);
            color: #fff;
        }
        .badge-sena {
            background-color: var(--sena-verde);
            color: #fff;
        }
        .card-noticia {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-noticia:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1) !important;
        }
        .card-img-top-noticia {
            height: 220px;
            object-fit: cover;
        }
        main {
            flex: 1;
        }
        footer {
            background-color: var(--sena-azul);
            color: #d9e2ec;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-sena sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'inicio' %}">
                <span class="badge bg-success fs-6">SENA</span>
                <span>CAI Regional Valle</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'inicio' %}active fw-semibold{% endif %}" href="{% url 'inicio' %}">
                            <i class="bi bi-newspaper me-1"></i>Portal de Noticias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'tabla_noticias' %}active fw-semibold{% endif %}" href="{% url 'tabla_noticias' %}">
                            <i class="bi bi-table me-1"></i>Archivo General
                        </a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="/admin/" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-shield-lock me-1"></i>Panel Administrativo
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 mt-5">
        <div class="container text-center text-md-start d-md-flex justify-content-between align-items-center">
            <div>
                <h6 class="fw-bold text-white mb-1">Centro de Automatización Industrial - SENA Regional Valle</h6>
                <small>Portal Informativo Institucional para Aprendices, Instructores, Funcionarios y Comunidad.</small>
            </div>
            <div class="mt-3 mt-md-0">
                <a href="{% url 'inicio' %}" class="text-white text-decoration-none me-3 small">Inicio</a>
                <a href="{% url 'tabla_noticias' %}" class="text-white text-decoration-none me-3 small">Archivo</a>
                <a href="/admin/" class="text-warning text-decoration-none small">Acceso Admin</a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
